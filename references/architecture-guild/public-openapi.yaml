        in: path
        required: true
        schema:
          type: string
      - name: sort_by
        in: query
        required: false
        schema:
          default: null
          description: Column name to sort by; prefix with '-' for descending order.
          title: Sort By
          nullable: true
          type: string
      - name: limit
        in: query
        required: false
        schema:
          default: 20
          description: Maximum number of items to return.
          maximum: 1000
          minimum: 0
          title: Limit
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          default: 0
          description: Number of items to skip before returning results.
          maximum: 9223372036854775807
          minimum: 0
          title: Offset
          type: integer
      - name: search
        in: query
        required: false
        schema:
          default: null
          title: Search
          nullable: true
          type: string
      - name: archived
        in: query
        required: false
        schema:
          default: null
          title: Archived
          nullable: true
          type: boolean
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Skill'
                  pagination:
                    type: object
                    properties:
                      total_count:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
                      has_more:
                        type: boolean
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: create_account_skill
      tags:
      - accounts
      security:
      - apiKey: []
      parameters:
      - name: account_id_or_name
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  title: Name
                  type: string
                overview:
                  default: null
                  title: Overview
                  nullable: true
                  type: string
                is_public:
                  default: false
                  title: Is Public
                  type: boolean
                avatar_url:
                  default: null
                  title: Avatar Url
                  nullable: true
                  type: string
              required:
              - name
              title: CreateAccountSkillInput
              type: object
      responses:
        '201':
