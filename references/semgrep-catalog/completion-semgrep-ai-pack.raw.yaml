ected in settings or environment file. ANTHROPIC_BASE_URL or OPENAI_BASE_URL overrides can redirect all API traffic to an attacker-controlled server, exposing prompts, code, and API keys. Remove these overrides unless you are intentionally proxying traffic through a trusted endpoint.","metadata":{"cwe":"CWE-923: Improper Restriction of Communication Channel to Intended Endpoints","category":"security","confidence":"MEDIUM","subcategory":["vuln"],"likelihood":"HIGH","impact":"MEDIUM","technology":["claude-code","cursor"],"references":["https://docs.anthropic.com/en/docs/claude-code/security"],"license":"Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license","vulnerability_class":["Other"],"source":"https://semgrep.dev/r/ai.ai-best-practices.claude-settings-env-url-override.claude-settings-env-url-override.claude-settings-env-url-override-generic","shortlink":"https://sg.run/D8Yoo","semgrep.dev":{"rule":{"r_id":286708,"rv_id":1409305,"rule_id":"NbU96kk","version_id":"0bTG0vB","url":"https://semgrep.dev/playground/r/0bTG0vB/ai.ai-best-practices.claude-settings-env-url-override.claude-settings-env-url-override.claude-settings-env-url-override-generic","origin":"community"}}},"paths":{"include":["**/settings.json","**/.env*","**/.claude/**","**/*.settings.json"]},"pattern-regex":"(ANTHROPIC_BASE_URL|OPENAI_BASE_URL)\\s*\"?\\s*[=:]\\s*\"?\\s*\\S+"},{"id":"ai.ai-best-practices.agent-unbounded-loop.agent-unbounded-loop.agent-unbounded-loop-python","languages":["python"],"severity":"WARNING","message":"LLM API call inside a `while True` loop without a break condition. This creates an unbounded agent loop that may run indefinitely, consuming API credits and resources. Add a break condition, iteration counter, or timeout to prevent runaway execution.","metadata":{"cwe":"CWE-835: Loop with Unreachable Exit Condition ('Infinite Loop')","category":"security","confidence":"MEDIUM","subcategory":["audit"],"likelihood":"MEDIUM","impact":"MEDIUM","techno