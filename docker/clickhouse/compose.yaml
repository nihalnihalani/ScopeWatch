# Local ClickHouse for development/replay/contract tests. NOT ClickHouse Cloud; results are labeled clickhouse_local.
name: scopewatch-ch
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8@sha256:0152dd511befe6a2c2ef53e930726179669b08116da78500b37c51c96ff5ee77
    container_name: scopewatch-clickhouse
    ports:
      - "127.0.0.1:18123:8123"
    environment:
      CLICKHOUSE_USER: sw_admin
      CLICKHOUSE_PASSWORD: ${SCOPEWATCH_CH_ADMIN_PASSWORD:-local-dev-admin}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "sw_admin", "--password", "${SCOPEWATCH_CH_ADMIN_PASSWORD:-local-dev-admin}", "-q", "SELECT 1"]
      interval: 2s
      timeout: 3s
      retries: 30
