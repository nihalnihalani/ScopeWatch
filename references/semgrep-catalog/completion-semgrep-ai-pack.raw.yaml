 call without error handling. Wrap API calls in try/except to handle rate limits, API errors, and network issues gracefully.","metadata":{"cwe":"CWE-754: Improper Check for Unusual or Exceptional Conditions","category":"security","subcategory":["audit"],"likelihood":"MEDIUM","impact":"MEDIUM","confidence":"MEDIUM","technology":["mistral"],"references":["https://docs.mistral.ai/capabilities/guardrailing/"],"license":"Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license","vulnerability_class":["Other"],"source":"https://semgrep.dev/r/ai.ai-best-practices.mistral-no-error-handling.mistral-no-error-handling.mistral-no-error-handling","shortlink":"https://sg.run/jx9NJ","semgrep.dev":{"rule":{"r_id":286765,"rv_id":1409362,"rule_id":"NbU96AG","version_id":"0bTG0OO","url":"https://semgrep.dev/playground/r/0bTG0OO/ai.ai-best-practices.mistral-no-error-handling.mistral-no-error-handling.mistral-no-error-handling","origin":"community"}}},"patterns":[{"pattern-either":[{"pattern":"$CLIENT.chat.complete(...)"},{"pattern":"$CLIENT.chat.stream(...)"}]},{"pattern-not-inside":"try:\n    ...\nexcept ...:\n    ...\n"}]},{"id":"ai.ai-best-practices.hooks-wget-pipe-bash.hooks-wget-pipe-bash.hooks-wget-pipe-bash-generic","languages":["generic"],"severity":"ERROR","message":"Remote script is fetched and piped directly to a shell interpreter. In Claude Code and Cursor hooks, this enables remote code execution from untrusted sources. Download the script first, inspect it, then execute it separately.","metadata":{"cwe":"CWE-829: Inclusion of Functionality from Untrusted Control Sphere","category":"security","subcategory":["vuln"],"likelihood":"HIGH","impact":"MEDIUM","confidence":"HIGH","technology":["claude-code","cursor"],"references":["https://docs.anthropic.com/en/docs/claude-code/hooks","https://cursor.com/docs/agent/hooks"],"license":"Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license","vulnerability_class":["Other"],"source":"https://semgrep.dev/r/ai.ai-best-practices.hooks-wget-pipe-bash.hooks-wget-pipe-bash.hooks-wget-pipe-bash-generic","shortlink":"https://sg.run/gp1LZ","semgrep.dev":{"rule":{"r_id":286741,"rv_id":1409338,"rule_id":"5rUP7Oz","version_id":"3ZT25Jb","url":"https://semgrep.dev/playground/r/3ZT25Jb/ai.ai-best-practices.hooks-wget-pipe-bash.hooks-wget-pipe-bash.hooks-wget-pipe-bash-generic","origin":"community"}}},"paths":{"include":["*.sh","*.bash"]},"pattern-regex":"(curl|wget)\\s+.*\\|\\s*(bash|sh|zsh)\\b"},{"id":"ai.ai-best-practices.hooks-unquoted-variable.hooks-unquoted-variable.hooks-unquoted-variable-bash-eval","languages":["bash"],"severity":"WARNING","message":"Use of `eval` in a Claude Code or Cursor hook script is dangerous. The `eval` command re-parses its arguments, which can lead to command injection if any variable contains special characters or attacker-controlled data. Avoid `eval` entirely; use arrays, direct command invocation, or other safe alternatives.","metadata":{"cwe":"CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')","category":"security","subcategory":["vuln"],"likelihood":"MEDIUM","impact":"HIGH","confidence":"MEDIUM","technology":["claude-code","cursor"],"references":["https://docs.anthropic.com/en/docs/claude-code/hooks","https://cursor.com/docs/agent/hooks"],"license":"Semgrep Rules License v1.0. For more details, visit semgrep.dev/legal/rules-license","vulnerability_class":["Command Injection"],"source":"https://semgrep.dev/r/ai.ai-best-practices.hooks-unquoted-variable.hooks-unquoted-variable.hooks-unquoted-variable-bash-eval","shortlink":"https://sg.run/8xJyE","semgrep.dev":{"rule":{"r_id":286740,"rv_id":1409337,"rule_id":"JDU3nyx","version_id":"QkTERyA","url":"https://semgrep.dev/playground/r/QkTERyA/ai.ai-best-practices.hooks-unquoted-variable.hooks-unquoted-variable.hooks-unquoted-variable-bash-eval","origin":"community"}}},"pattern":"eval $...ARGS"},{"id":"ai.ai-best-practices.hoo