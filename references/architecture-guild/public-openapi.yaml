  schemas:
    Account:
      oneOf:
      - $ref: '#/components/schemas/Organization'
      - $ref: '#/components/schemas/User'
    AccountItem:
      description: 'An account as ``gen_serialize_account`` emits it. Users and

        organizations share the account pattern; ``email_domain`` appears only

        for organizations.'
      properties:
        id:
          format: uuid
          title: Id
          type: string
        entity_type:
          title: Entity Type
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        type:
          enum:
          - user
          - organization
          title: Type
          type: string
        name:
          title: Name
          type: string
        full_name:
          title: Full Name
          nullable: true
          type: string
        avatar_url:
          title: Avatar Url
          nullable: true
          type: string
        bio:
          title: Bio
          nullable: true
          type: string
        banner_url:
          title: Banner Url
          nullable: true
          type: string
        website_url:
          title: Website Url
          nullable: true
          type: string
        github_url:
          title: Github Url
          nullable: true
          type: string
        x_url:
          title: X Url
          nullable: true
          type: string
        linkedin_url:
          title: Linkedin Url
          nullable: true
